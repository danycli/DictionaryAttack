<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary Attack Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Dictionary Attack Lab</h1>
            <span class="badge">Local Authentication Lab</span>
        </header>

        <main>
            <form id="login-form" class="login-card">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required aria-label="Username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required aria-label="Password">
                </div>

                <button type="submit" id="login-btn">Login</button>
            </form>

            <div id="response-panel" class="response-panel hidden" aria-live="polite">
                <h3>API Response</h3>
                <div id="status-header" class="status-header"></div>
                <pre><code id="response-code"></code></pre>
            </div>
        </main>
    </div>
    
    <script src="logic.js"></script>
</body>
</html>
